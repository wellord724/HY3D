DATASET:
    DATA:
        DATASET_NAME: "Campus3D"
        DATA_LIST_FILE: "data/data_list_origin.yaml"
        H_MATRIX_LIST_FILE: "data/matrix_file_list_origin.yaml"
        SORT_H_MATRIX_BY_CLASS_NUM: true
        REMOVE_ZERO_LABEL: true
        LABEL_NUMBER:
            - 3
            - 4
            - 6
            - 9
            - 15
        USE_COLOR: true
        COLOR_CHANNEL:
            - 3
            - 4
            - 5
    SAMPLE:
        LABEL_WEIGHT_POLICY: "log"
        SAMPLER_TYPE: "BlockSampler"
        RANDOM_SCENE_CHOOSE: false
        SETTING:
            MODIFY_TYPE:
                - "block_centeralization"
            NUM_POINTS_PER_SAMPLE: 2048
            KNN_MODULE: "SkNN"
            OVERLAP_RATIO: 0.5
            BOX_SIZE_X: 12
            BOX_SIZE_Y: 12
            SLIDING_RATIO: 0.5
            SPARSE_THRESH: 0.3
            REBUILD_TREE: false
        RETURN_INDEX: false
        RANDOM_SEED_BASIS: 0
