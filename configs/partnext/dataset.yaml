DATASET:
  DATA:
    DATASET_NAME: "PartNeXt"
    PARTNEXT_CACHE: "data/partnext_campus5/samples"
    REMOVE_ZERO_LABEL: true
    SPLIT_DIR: "data/partnext_campus5"
    TAXONOMY_FILE: "data/partnext_campus5/taxonomy.json"
    H_MATRIX_LIST_FILE: "data/partnext_campus5/partnext_matrix_file_list.yaml"
    SORT_H_MATRIX_BY_CLASS_NUM: false
    LABEL_NUMBER:
      - 63
      - 264
      - 638
      - 919
      - 1260
    USE_COLOR: true
    COLOR_CHANNEL:
      - 3
      - 4
      - 5
  SAMPLE:
    LABEL_WEIGHT_POLICY: "log"
    SAMPLER_TYPE: "BlockSampler"
    SETTING:
      MODIFY_TYPE:
        - "block_centeralization"
      NUM_POINTS_PER_SAMPLE: 2048
      KNN_MODULE: "SkNN"
      OVERLAP_RATIO: 0.5
      BOX_SIZE_X: 12
      BOX_SIZE_Y: 12
      SLIDING_RATIO: 0.5
      SPARSE_THRESH: 0.3
      REBUILD_TREE: false
    RETURN_INDEX: false
    RANDOM_SEED_BASIS: 0
